name: Word-list entry
description: Add, remove or recategorise an entry in the bundled Persian, Finglish or English list.
title: "[wordlist] "
labels: ["word list"]
body:
  - type: markdown
    attributes:
      value: |
        The bundled lists live in [`wordlists/`](https://github.com/AmirehsanK/PersianTextGuard/tree/main/wordlists);
        each file's header explains the format, the categories, and what is deliberately left out.
        Pull requests are welcome too — see [CONTRIBUTING.md](https://github.com/AmirehsanK/PersianTextGuard/blob/main/CONTRIBUTING.md#changing-the-word-lists).

  - type: dropdown
    id: change
    attributes:
      label: What change
      options:
        - Add an entry
        - Remove an entry
        - Move an entry to a different category
        - Change an entry between whole-word and anywhere
    validations:
      required: true

  - type: textarea
    id: entries
    attributes:
      label: The entries, one per line
      description: Write them as they would appear in the file — a leading `~` means "match anywhere, inside longer words too".
      placeholder: |
        کسکش
        ~fuckwit
      render: text
    validations:
      required: true

  - type: dropdown
    id: list
    attributes:
      label: Which list
      options:
        - persian.txt
        - finglish.txt
        - english.txt
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: "`mild` is for words that are ordinary in some contexts; the default bundled list leaves them out."
      options:
        - profanity
        - sexual
        - insult
        - slur
        - harassment
        - mild
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: Where it is used, and — for a removal or recategorisation — the ordinary sentence it wrongly flags.
    validations:
      required: true

  - type: checkboxes
    id: rules
    attributes:
      label: The curation rules
      description: These keep ordinary messages passing. See the header of `wordlists/persian.txt`.
      options:
        - label: This is a different **spelling**, not typography the matcher already handles (leetspeak `sh1t`, held keys `fuuuck`, spaced or dotted letters `ک.ی.ر`, accents `fück`, Persian suffixes «جنده‌ها»).
          required: true
        - label: If I marked it `~anywhere`, every longer word containing it is also offensive — it does not hide inside ordinary words (`ass` in `class`, `کس` in «کسی»).
          required: true
        - label: It is not the name of an ethnicity, nationality or religion. (Slurs *about* a group belong in `slur`.)
          required: true
        - label: If I copied it from another list, that list's licence is MIT-compatible (MIT, Apache 2.0, CC0, CC BY) and I have said which one below.
          required: false
