name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore dotnet/PersianTextGuard.slnx

      - name: Build
        run: dotnet build dotnet/PersianTextGuard.slnx -c Release --no-restore

      - name: Test (.NET 8 and .NET 10)
        run: dotnet test dotnet/tests/PersianTextGuard.Tests -c Release --no-build

      - name: Conformance corpus (.NET 8 and .NET 10)
        run: dotnet test dotnet/tests/PersianTextGuard.Conformance -c Release --no-build

      # The version comes from the VERSION file only; the publish job checks the tag against it.
      - name: Pack
        run: dotnet pack dotnet/src/PersianTextGuard -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  netfx:
    name: Test on .NET Framework 4.8 (netstandard2.0 build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test dotnet/tests/PersianTextGuard.Tests -c Release -f net48

      - name: Conformance corpus
        run: dotnet test dotnet/tests/PersianTextGuard.Conformance -c Release -f net48

  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
        with:
          # The API compatibility check reads the report from earlier release tags.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Conformance corpus
        run: npm run corpus

      - name: README examples
        run: npm run test:readme

      - name: Pack
        if: matrix.node == 24
        run: npm run pack

      - name: Package checks (publint, attw)
        if: matrix.node == 24
        run: npm run check:package

      - name: API report
        if: matrix.node == 24
        run: npm run api

      - name: API compatibility with the previous release
        if: matrix.node == 24
        run: npm run api:compat

      - name: Consumer checks (import, require, TypeScript, browser bundle)
        if: matrix.node == 24
        run: npm run check:consumers -- --no-pack

      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: npm-package
          path: js/artifacts/*.tgz

  publish:
    name: Publish to NuGet
    needs: [build, netfx, javascript]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write   # NuGet trusted publishing: no long-lived API key stored in GitHub
    steps:
      - uses: actions/checkout@v5

      # A tag must name the version being released: v1.2.3 only when VERSION says 1.2.3.
      - name: Check tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-npm:
    name: Publish to npm
    # Lockstep: neither registry publishes unless every job for every port is green.
    needs: [build, netfx, javascript]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # npm trusted publishing: no token stored in GitHub, and provenance is generated automatically
    steps:
      - uses: actions/checkout@v5

      # A tag must name the version being released: v1.2.3 only when VERSION says 1.2.3.
      - name: Check tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      # Re-running this job after a partial release is safe: a version already on npm is skipped.
      - name: Publish (skip if already published)
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          if npm view "persian-text-guard@$V" version >/dev/null 2>&1; then echo "persian-text-guard@$V already published"; exit 0; fi
          # The leading ./ matters: without it npm reads "npm-package/..." as a GitHub repository.
          # npm requires a dist-tag for a prerelease version; only a plain x.y.z becomes "latest".
          case "$V" in *-*) TAG=next ;; *) TAG=latest ;; esac
          npm publish "./npm-package/persian-text-guard-$V.tgz" --access public --tag "$TAG"
