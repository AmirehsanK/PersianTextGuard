name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore dotnet/PersianTextGuard.slnx

      - name: Build
        run: dotnet build dotnet/PersianTextGuard.slnx -c Release --no-restore

      - name: Test (.NET 8 and .NET 10)
        run: dotnet test dotnet/tests/PersianTextGuard.Tests -c Release --no-build

      - name: Conformance corpus (.NET 8 and .NET 10)
        run: dotnet test dotnet/tests/PersianTextGuard.Conformance -c Release --no-build

      # A tag v1.2.3 publishes version 1.2.3; everything else packs the version in the project file.
      - name: Pack
        run: |
          VERSION_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION_ARG="-p:Version=${GITHUB_REF_NAME#v}"; fi
          dotnet pack dotnet/src/PersianTextGuard -c Release --no-build -o artifacts $VERSION_ARG

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  netfx:
    name: Test on .NET Framework 4.8 (netstandard2.0 build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test dotnet/tests/PersianTextGuard.Tests -c Release -f net48

      - name: Conformance corpus
        run: dotnet test dotnet/tests/PersianTextGuard.Conformance -c Release -f net48

  publish:
    name: Publish to NuGet
    needs: [build, netfx]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write   # NuGet trusted publishing: no long-lived API key stored in GitHub
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
