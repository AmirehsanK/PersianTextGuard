name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore dotnet/PersianTextGuard.slnx

      - name: Build
        run: dotnet build dotnet/PersianTextGuard.slnx -c Release --no-restore

      - name: Test (.NET 8 and .NET 10)
        run: dotnet test dotnet/tests/PersianTextGuard.Tests -c Release --no-build

      - name: Conformance corpus (.NET 8 and .NET 10)
        run: dotnet test dotnet/tests/PersianTextGuard.Conformance -c Release --no-build

      # The version comes from the VERSION file only; the publish job checks the tag against it.
      - name: Pack
        run: dotnet pack dotnet/src/PersianTextGuard -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  netfx:
    name: Test on .NET Framework 4.8 (netstandard2.0 build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test dotnet/tests/PersianTextGuard.Tests -c Release -f net48

      - name: Conformance corpus
        run: dotnet test dotnet/tests/PersianTextGuard.Conformance -c Release -f net48

  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v5
        with:
          # The API compatibility check reads the report from earlier release tags.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint and type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Conformance corpus
        run: npm run corpus

      - name: README examples
        run: npm run test:readme

      - name: Pack
        if: matrix.node == 24
        run: npm run pack

      - name: Package checks (publint, attw)
        if: matrix.node == 24
        run: npm run check:package

      - name: API report
        if: matrix.node == 24
        run: npm run api

      - name: API compatibility with the previous release
        if: matrix.node == 24
        run: npm run api:compat

      - name: Consumer checks (import, require, TypeScript, browser bundle)
        if: matrix.node == 24
        run: npm run check:consumers -- --no-pack

      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: npm-package
          path: js/artifacts/*.tgz

  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
        with:
          # The API compatibility check compares with the newest release tag that has python/.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0 (no moving major tag is published)
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install
        if: matrix.python != '3.14'
        run: uv sync --locked

      # The package checks need the "package" group, whose README renderer has wheels for every
      # interpreter on Linux but is only needed here.
      - name: Install (with the package-check tools)
        if: matrix.python == '3.14'
        run: uv sync --locked --group package

      - name: Interpreter
        run: |
          uv run python -c "import sys, unicodedata; print(sys.version, unicodedata.unidata_version, getattr(sys, '_is_gil_enabled', lambda: True)())"

      # "3.14" must be the standard build: the free-threaded one has its own job.
      - name: Check 3.14 is the standard build
        if: matrix.python == '3.14'
        run: uv run python -c "import sys; sys.exit(0 if sys._is_gil_enabled() else 'expected the standard (GIL) build')"

      - name: Lint and type check
        if: matrix.python != '3.14t'
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run python scripts/check_unicode_usage.py
          uv run mypy

      - name: Unit tests
        if: matrix.python != '3.14t'
        run: uv run pytest -m "not corpus"

      - name: Conformance corpus
        if: matrix.python != '3.14t'
        run: uv run pytest -m corpus

      # Free-threaded CPython with the GIL off, so the thread tests really run in parallel.
      - name: All tests, with the GIL off
        if: matrix.python == '3.14t'
        env:
          PYTHON_GIL: "0"
        run: uv run pytest

      - name: Unit tests on 8 threads at once, with the GIL off
        if: matrix.python == '3.14t'
        env:
          PYTHON_GIL: "0"
        run: uv run pytest -p pytest_run_parallel --parallel-threads=8 -m "not corpus and not threads"

      - name: Build
        if: matrix.python == '3.14'
        run: uv build

      - name: Package checks (twine, check-wheel-contents, contents, metadata, size)
        if: matrix.python == '3.14'
        run: uv run python scripts/check_package.py

      - name: Consumer checks (wheel, sdist, pyright and mypy strict)
        if: matrix.python == '3.14'
        run: uv run python scripts/check_consumers.py

      - name: API compatibility with the previous release
        if: matrix.python == '3.14'
        run: uv run python scripts/check_api.py

      - name: Benchmark regression gate
        if: matrix.python == '3.14'
        run: uv run python scripts/bench_gate.py

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.14'
        with:
          name: python-package
          path: python/dist/*

  rust:
    name: Rust (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["stable", "1.85"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, pinned by commit
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: rust

      # Unit, integration, corpus (one trial per case), thread, proptest and doc tests, README included.
      - name: Test
        run: cargo test --locked

  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
        with:
          # cargo-semver-checks and the package checks read the repository's history.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, pinned by commit
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: |
            rust
            rust/bench

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Documentation
        run: |
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The Unicode tables are generated from .NET itself (research R1); they must not drift.
      - name: Regenerate the Unicode tables
        run: |
          dotnet run tools/gen_tables.cs -- src/tables.rs
          git diff --exit-code src/tables.rs

      # SC-007: 100,000 arbitrary strings and 100,000 arbitrary byte sequences.
      - name: No-panic property test (full count)
        env:
          PROPTEST_CASES: "100000"
        run: cargo test --locked --release --test no_panic

      - name: Package checks
        run: |
          scripts/prepare-package.sh
          scripts/check-package.sh

      # Before the first release crates.io has no crate, so there is no baseline to compare with.
      - name: Is there a published version to compare with?
        id: baseline
        run: |
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' -A "PersianTextGuard CI (https://github.com/AmirehsanK/PersianTextGuard)" https://crates.io/api/v1/crates/persian-text-guard)"
          if [ "$STATUS" = "404" ]; then
            echo "baseline: no previous release"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "baseline: the newest persian-text-guard on crates.io (HTTP $STATUS)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: API compatibility with the previous release
        if: steps.baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239  # v2.9
        with:
          package: persian-text-guard
          manifest-path: rust/Cargo.toml

      - name: Benchmark regression gate
        run: scripts/bench-gate.sh

      - uses: actions/upload-artifact@v4
        with:
          name: crate-package
          path: rust/target/package/*.crate

  publish:
    name: Publish to NuGet
    needs: [build, netfx, javascript, python, rust, rust-checks]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write   # NuGet trusted publishing: no long-lived API key stored in GitHub
    steps:
      - uses: actions/checkout@v5

      # A tag must name the version being released: v1.2.3 only when VERSION says 1.2.3.
      - name: Check tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-npm:
    name: Publish to npm
    # Lockstep: no registry publishes unless every job for every port is green.
    needs: [build, netfx, javascript, python, rust, rust-checks]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write   # npm trusted publishing: no token stored in GitHub, and provenance is generated automatically
    steps:
      - uses: actions/checkout@v5

      # A tag must name the version being released: v1.2.3 only when VERSION says 1.2.3.
      - name: Check tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-package

      # Re-running this job after a partial release is safe: a version already on npm is skipped.
      - name: Publish (skip if already published)
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          if npm view "persian-text-guard@$V" version >/dev/null 2>&1; then echo "persian-text-guard@$V already published"; exit 0; fi
          # The leading ./ matters: without it npm reads "npm-package/..." as a GitHub repository.
          # npm requires a dist-tag for a prerelease version; only a plain x.y.z becomes "latest".
          case "$V" in *-*) TAG=next ;; *) TAG=latest ;; esac
          npm publish "./npm-package/persian-text-guard-$V.tgz" --access public --tag "$TAG"

  publish-pypi:
    name: Publish to PyPI
    # Lockstep: no registry publishes unless every job for every port is green.
    needs: [build, netfx, javascript, python, rust, rust-checks]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing: no token stored in GitHub, and attestations are generated
    steps:
      - uses: actions/checkout@v5

      # A tag must name the version being released: v1.2.3 only when VERSION says 1.2.3.
      - name: Check tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0 (no moving major tag is published)

      # PyPI versions are PEP 440: VERSION 1.4.0-dev.2 is 1.4.0.dev2 in the file names. packaging comes
      # through uv, because the runner's system pip refuses to install into it (PEP 668).
      - name: Check file versions
        run: |
          ls dist
          uv run --no-project --with packaging python -c "import pathlib, sys; from packaging.version import Version; v = str(Version(pathlib.Path('VERSION').read_text().strip())); names = sorted(p.name for p in pathlib.Path('dist').iterdir()); expected = sorted([f'persian_text_guard-{v}-py3-none-any.whl', f'persian_text_guard-{v}.tar.gz']); print(names); sys.exit(0 if names == expected else f'expected {expected}')"

      # Re-running this job after a partial release is safe: files already on PyPI are skipped.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-crates:
    name: Publish to crates.io
    # Lockstep: no registry publishes unless every job for every port is green.
    needs: [build, netfx, javascript, python, rust, rust-checks]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write   # crates.io trusted publishing, once the crate exists and it is configured
    env:
      # The first release publishes with a short-lived, publish-new-only token in this environment;
      # later releases have no secret and authenticate through crates-io-auth-action (research R12).
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      # A tag must name the version being released: v1.2.3 only when VERSION says 1.2.3.
      - name: Check tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)" || { echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      - name: Check Cargo.toml matches VERSION
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          grep -qx "version = \"$V\"" rust/Cargo.toml || { echo "rust/Cargo.toml does not say version = \"$V\"; run rust/scripts/set-version.sh"; exit 1; }

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # master, pinned by commit
        with:
          toolchain: stable

      # Re-running this job after a partial release is safe: a version already on crates.io is skipped.
      - name: Skip if already published
        id: published
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' -A "PersianTextGuard CI (https://github.com/AmirehsanK/PersianTextGuard)" "https://crates.io/api/v1/crates/persian-text-guard/$V")"
          if [ "$STATUS" = "200" ]; then
            echo "persian-text-guard $V is already on crates.io"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy the word lists, licence and notices into the crate
        if: steps.published.outputs.exists == 'false'
        run: rust/scripts/prepare-package.sh

      - name: Authenticate (trusted publishing)
        id: auth
        if: steps.published.outputs.exists == 'false' && env.HAS_TOKEN == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      - name: Publish
        if: steps.published.outputs.exists == 'false'
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --locked
