[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "persian-text-guard"
dynamic = ["version"]
description = "Persian text normalization and evasion-resistant profanity filtering for Python. Folds Arabic/Persian look-alike letters, zero-width and bidi characters, and all three digit ranges, and catches the ways people get around a word list: spaced or dotted letters, held keys, leetspeak, filler symbols, Cyrillic look-alikes and Finglish. Finds every match with its position and censors messages with a fixed mask. Ships an optional curated Persian/Finglish/English word list of about 1,250 categorised entries."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "Amirehsan Kohannasab" }]
keywords = [
    "persian",
    "farsi",
    "finglish",
    "profanity",
    "profanity-filter",
    "moderation",
    "normalization",
    "arabic",
    "text",
    "rtl",
    "python",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: Persian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AmirehsanK/PersianTextGuard/tree/main/python#readme"
Source = "https://github.com/AmirehsanK/PersianTextGuard"
Issues = "https://github.com/AmirehsanK/PersianTextGuard/issues"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-run-parallel>=0.10",
    "mypy>=2.3",
    "pyright>=1.1.414",
    "ruff>=0.16",
    "pyperf>=2.10",
    "griffe>=2.3",
]
# The package checks (research R12) run on CPython 3.14 only. readme-renderer's Markdown extra needs
# comrak, which has no wheel for every interpreter on every platform (none for 3.11-3.13 or 3.14t on
# Windows), so these tools live in their own group: `uv sync --locked --group package`.
package = [
    "build>=1.6",
    "twine>=7.0",
    "check-wheel-contents>=0.6",
    "readme-renderer[md]>=46",
]

# The editable install is rebuilt, which reruns the build hook, whenever an input of the generated
# modules changes or one of them is missing; uv would otherwise reuse its cached build.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "../VERSION" },
    { file = "../wordlists/*.txt" },
    { file = "src/persian_text_guard/_wordlists.py" },
    { file = "src/persian_text_guard/_version.py" },
]

# hatchling has no custom version source, so the metadata hook sets the version (research R4).
[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/persian_text_guard"]
artifacts = [
    "src/persian_text_guard/_wordlists.py",
    "src/persian_text_guard/_version.py",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/persian_text_guard",
    "pyproject.toml",
    "hatch_build.py",
    "README.md",
    "LICENSE",
    "THIRD-PARTY-NOTICES.md",
]
artifacts = [
    "src/persian_text_guard/_wordlists.py",
    "src/persian_text_guard/_version.py",
    "LICENSE",
    "THIRD-PARTY-NOTICES.md",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D", "ANN", "PL", "PT", "TID"]
# A line-by-line port compares against code points and lengths that are the specification (PLR2004),
# keeps the other ports' signatures and control flow (PLR0911-PLR0917), and its text and docs are
# Persian, whose letters look like Latin ones (RUF001-RUF003).
ignore = ["PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unicodedata".msg = "Use persian_text_guard._unicode (spec 004 research R1)"

[tool.ruff.lint.per-file-ignores]
"src/persian_text_guard/_unicode.py" = ["TID251"]
"tests/**" = ["D", "ANN", "PLR2004", "TID251"]
"tools/**" = ["D"]
"scripts/**" = ["D"]
"bench/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts", "bench", "consumers/typed_usage.py"]

# pyperf ships no type information; only the benchmark scripts import it.
[[tool.mypy.overrides]]
module = ["pyperf", "pyperf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The corpus runner is the package tests/corpus, imported as corpus.
pythonpath = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "corpus: a conformance corpus case or guard",
    "threads: multi-threaded tests",
]
xfail_strict = true
